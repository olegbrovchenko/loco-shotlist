<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shot List</title>
<style>
/* ---------- tokens (gruvbox, mirrors the Obsidian theme) ---------- */
:root{
  --bg:#1d2021; --bg2:#282828; --bg3:#32302f; --line:#3c3836; --line2:#504945;
  --fg:#ffffff; --fg2:#c8c8c8; --fg3:#9a9a9a; --accent:#fe8019; --danger:#fb4934;
  --hover:rgba(255,255,255,.06); --shadow:0 12px 40px rgba(0,0,0,.55); --title:#fb4934; --h2:#fabd2f;
  --font:"Acumin Pro",-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Helvetica,Arial,sans-serif;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --r1:4px; --r2:6px; --r3:10px;
  --t-body:14px; --t-ui:13px; --t-pill:12px; --t-label:11px;
  --row-min:36px; --cell-x:10px; --cell-y:8px; --gutter:28px;
  --dur:120ms; --ease:cubic-bezier(.2,.7,.2,1);
  /* drop marker: thin warm core, three blue halation layers (tight -> soft -> softest) */
  --drop-w:2px; --drop-core:var(--accent);
  --drop-g1:rgba(96,165,255,.60); --drop-g2:rgba(96,165,255,.32); --drop-g3:rgba(96,165,255,.16);
  /* fade from the middle out to both ends. Stops are percentages, so the mask is
     always exactly as long as the marker, whatever the table's size. */
  --drop-fade:transparent 0%,#000 22%,#000 78%,transparent 100%;
}
/* light = Notion-style: white paper, warm greys, blue accent; tag colours are untouched */
[data-theme="light"]{
  --bg:#ffffff; --bg2:#ffffff; --bg3:#f7f7f5; --line:#e9e9e7; --line2:#d3d1cb;
  --fg:#37352f; --fg2:#6b6a66; --fg3:#8f8e8a; --accent:#2383e2; --danger:#e03e3e;
  --hover:rgba(55,53,47,.06); --shadow:0 8px 28px rgba(15,15,15,.14),0 0 0 1px rgba(15,15,15,.05); --title:#37352f; --h2:#37352f;
}
@media (prefers-reduced-motion: reduce){ :root{ --dur:0ms } }

*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:var(--t-body)/1.45 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0;border-radius:var(--r2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}

/* ---------- page ---------- */
main{max-width:1900px;margin:0 auto;padding:var(--s5) var(--s6) 120px}
#title,#heading{cursor:text;border-radius:var(--r1);outline:0;padding:2px 6px;margin-inline-start:-6px}
#title:hover,#heading:hover,#title:focus,#heading:focus{background:var(--hover)}
#title:focus,#heading:focus{box-shadow:0 0 0 2px var(--accent)}
h1{font-size:26px;line-height:1.15;font-weight:800;color:var(--title);margin:0 0 var(--s4);letter-spacing:-.01em;text-wrap:balance}
.audio{margin-bottom:var(--s5)}
.audio audio{width:100%;display:block;color-scheme:dark}
[data-theme="light"] .audio audio{color-scheme:light}
.audio .name{font-size:var(--t-label);color:var(--fg3);margin-bottom:var(--s2)}
.audio .name:empty{display:none}
h2{font-size:22px;line-height:1.15;font-weight:800;color:var(--h2);margin:0 0 var(--s3);display:flex;align-items:center;gap:var(--s2)}

/* language: the switch, and the mark on a description that has no translation yet */
.tb.lang{font-weight:700;letter-spacing:.04em}
.tb.lang .t{font-size:var(--t-label)}
.cell.untr{color:var(--fg3)}
.cell.untr::after{content:'';display:block;height:0;border-bottom:1px dotted var(--fg3);opacity:.5}
td.editing .cell.untr::after{display:none}

/* ---------- toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s3);min-height:36px}
.tabs{display:flex;align-items:center;gap:2px}
.tab{height:32px;padding:0 var(--s3);font-weight:600;color:var(--fg2);display:inline-flex;gap:6px;align-items:center;line-height:1;transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.tab svg.i{display:block;align-self:center;flex:none;width:15px;height:15px;opacity:.75}
.tab span{display:block;align-self:center}
.tab.on{color:var(--fg);background:var(--bg3)}
.tb{height:32px;padding:0 var(--s3);color:var(--fg2);display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:var(--t-ui);transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.tb.icon{width:32px;padding:0;justify-content:center}
.tb.on{color:var(--accent)}
.tb.primary{color:var(--fg);font-weight:600}
@media (hover:hover){ .tab:hover,.tb:hover{background:var(--hover);color:var(--fg)} .tb.on:hover{color:var(--accent)} }
.count{color:var(--fg3);font-size:var(--t-ui);margin-inline-start:var(--s2);font-variant-numeric:tabular-nums}
.spacer{flex:1}
.actions{display:flex;align-items:center;gap:2px;margin-inline-start:var(--s4)}
.search{display:none;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r2);padding:0 var(--s1) 0 var(--s2);height:32px}
.search.on{display:inline-flex}
.search input{background:none;border:0;outline:0;width:220px;height:100%}
.search input::-webkit-search-cancel-button{display:none}
.zoom{display:inline-flex;align-items:center;margin-inline-start:var(--s2)}
.zoom .zpct{min-width:52px;padding:0 var(--s1);justify-content:center;font-variant-numeric:tabular-nums;font-size:var(--t-label);color:var(--fg3)}
.status{font-size:var(--t-label);color:var(--fg3);min-width:64px;text-align:end;font-variant-numeric:tabular-nums}
.status.err{color:var(--danger)}

/* ---------- table ---------- */
.wrap{overflow:auto;background:transparent;position:relative;overscroll-behavior-x:contain;margin-inline-start:calc(var(--gutter) * -1)}
table{border-collapse:separate;border-spacing:0;table-layout:fixed}
th,td{border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top;padding:0;position:relative;background:var(--bg2)}
th:last-child,td:last-child{border-inline-end:0}
thead th{position:sticky;top:0;z-index:3;background:var(--bg2);text-align:start;font-weight:500;color:var(--fg2);font-size:var(--t-ui);user-select:none}
thead th .h{display:flex;align-items:center;gap:6px;height:var(--row-min);padding:0 var(--cell-x);white-space:nowrap;overflow:hidden;cursor:pointer;width:100%;text-align:start;border-radius:0}
thead th .h span{overflow:hidden;text-overflow:ellipsis}
thead th .h svg.i{width:14px;height:14px;opacity:.8}
thead th .h .arrow{margin-inline-start:auto;display:inline-flex}
thead th .h .arrow svg.i{width:12px;height:12px;stroke-width:2.5;opacity:1}
@media (hover:hover){ thead th .h:hover{background:var(--hover);color:var(--fg)} }
.rz{position:absolute;top:0;inset-inline-end:-4px;width:8px;height:100%;cursor:col-resize;z-index:4;background:none;border-radius:0}
.rz::after{content:"";position:absolute;inset:0 3px;background:var(--accent);opacity:0;transition:opacity var(--dur) var(--ease)}
.rz:hover::after,.rz.on::after,.rz:focus-visible::after{opacity:.7}
@media (hover:hover){ tbody tr:hover td{background:var(--hover)} }
td .cell{padding:var(--cell-y) var(--cell-x);min-height:var(--row-min);white-space:pre-wrap;overflow-wrap:anywhere;text-wrap:pretty;cursor:text;border-radius:0}
td .cell:focus-visible{outline-offset:-2px}
td.t-time .cell{font-variant-numeric:tabular-nums}
td.t-checkbox .cell{display:flex;justify-content:center;align-items:flex-start;padding:calc(var(--cell-y) + (1.45em - 16px) / 2) var(--s1);cursor:pointer}
td.t-multi .cell{display:flex;flex-wrap:wrap;gap:var(--s1);align-items:flex-start;cursor:pointer;padding:6px var(--s2);overflow:hidden}
.wrap.compact td .cell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:var(--row-min);max-height:var(--row-min)}
.wrap.compact td.t-multi .cell{flex-wrap:nowrap}
.wrap.compact td.editing .cell{max-height:none}
td.editing{outline:2px solid var(--accent);outline-offset:-2px;background:var(--bg3)!important;z-index:2}
textarea.ed{display:block;width:100%;background:transparent;border:0;outline:0;resize:none;padding:var(--cell-y) var(--cell-x);line-height:1.45;overflow:hidden;min-height:var(--row-min);white-space:pre-wrap;overflow-wrap:anywhere}
input.cb{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0;flex:none}
.gutter{width:var(--gutter);border-inline-end:0!important;border-bottom:0!important;background:var(--bg)!important}
.gutter .rh{width:24px;height:24px;margin:6px 2px;display:flex;align-items:center;justify-content:center;color:var(--fg3);opacity:0;transition:opacity var(--dur) var(--ease),background var(--dur) var(--ease)}
.gutter .rh svg.i{width:14px;height:14px}
@media (hover:hover){ tbody tr:hover .gutter .rh{opacity:1} .gutter .rh:hover{background:var(--hover);color:var(--fg)} }
@media (hover:none){ .gutter .rh{opacity:.6} }
.gutter .rh:focus-visible{opacity:1}
tfoot td{border-bottom:0}
thead th .h{cursor:grab;touch-action:none}
body.dragging thead th .h{cursor:grabbing}
th.lifted .h{opacity:.35}
/* The dragged column's lane must read as EMPTY, exactly like a lifted row: the
   neighbours now slide across it, and dimmed-but-visible pills showed through
   under them as doubled content. */
td.lifted{opacity:.28}
td.lifted .cell{visibility:hidden}
.dropcol{position:absolute;top:0;width:var(--drop-w);margin-left:-1px;background:var(--drop-core);border-radius:var(--drop-w);z-index:5;pointer-events:none;box-shadow:0 0 2px var(--drop-g1),0 0 8px var(--drop-g2),0 0 20px var(--drop-g3);-webkit-mask-image:linear-gradient(to bottom,var(--drop-fade));mask-image:linear-gradient(to bottom,var(--drop-fade))}
.gutter .rh{cursor:grab;touch-action:none}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
tr.lifted td{opacity:.28}
tr.lifted td .cell{visibility:hidden}
/* the gap preview: only while dragging, so a normal render never animates */
body.dragging tbody tr,body.dragging thead th,body.dragging tbody td,body.dragging tfoot td{transition:transform 140ms var(--ease)}
@media (prefers-reduced-motion:reduce){ body.dragging tbody tr,body.dragging thead th,body.dragging tbody td,body.dragging tfoot td{transition:none} }
.ghost-table{position:fixed;z-index:70;pointer-events:none;border-collapse:separate;border-spacing:0;table-layout:fixed;background:var(--bg3);border:1px solid var(--line2);border-radius:var(--r2);box-shadow:0 18px 48px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.35);transform-origin:left center;animation:lift var(--dur) var(--ease)}
.ghost-table td,.ghost-table th{border-inline-end:1px solid var(--line);vertical-align:top;padding:0;position:relative}
/* a dragged column: full height, its own width, header on top */
.ghost-col{position:fixed;z-index:70;pointer-events:none;max-height:70vh;overflow:hidden;border-radius:var(--r2);box-shadow:0 18px 48px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.35);animation:lift var(--dur) var(--ease)}
.ghost-col>table{position:static;box-shadow:none;animation:none;border-radius:0}
.ghost-col th,.ghost-col td{border-inline-end:0;border-bottom:1px solid var(--line);background:var(--bg3)}
.ghost-col tbody tr:last-child td{border-bottom:0}
.ghost-table td:last-child{border-inline-end:0}
@keyframes lift{from{box-shadow:0 0 0 rgba(0,0,0,0)}}
.dropline{position:absolute;height:var(--drop-w);margin-top:-1px;background:var(--drop-core);border-radius:var(--drop-w);z-index:5;pointer-events:none;box-shadow:0 0 2px var(--drop-g1),0 0 8px var(--drop-g2),0 0 20px var(--drop-g3);-webkit-mask-image:linear-gradient(to right,var(--drop-fade));mask-image:linear-gradient(to right,var(--drop-fade))}
@media (prefers-reduced-motion: reduce){ .ghost-table{animation:none} }
.addrow{height:var(--row-min);padding:0 var(--cell-x);color:var(--fg3);display:flex;gap:6px;align-items:center;font-size:var(--t-ui);width:100%;text-align:start;border-radius:0}
.addrow svg.i{width:14px;height:14px}
@media (hover:hover){ .addrow:hover{color:var(--fg);background:var(--hover)} }
.empty{padding:var(--s6);color:var(--fg3);text-align:center}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:1px;border-radius:var(--r1);padding:2px 3px 2px 7px;font-size:var(--t-pill);font-weight:500;line-height:18px;flex:none;max-width:none;text-align:start}
.pill .t{white-space:nowrap}
.pill.ro{padding-inline-end:8px}
.pill.bright{text-shadow:0 1px 2px rgba(0,0,0,.55),0 0 1px rgba(0,0,0,.6)}
.pill.bright .x{opacity:.8}
.pill.renaming{outline:2px solid var(--accent);outline-offset:1px}
.pill .t[contenteditable="true"]{outline:0;min-width:1ch}
.pill .x{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;border-radius:3px;opacity:.6;color:inherit;position:relative;flex:none}
.pill .x::before{content:"";position:absolute;inset:-3px}
.pill .x svg.i{width:10px;height:10px;stroke-width:2.5}
.pill .x:hover,.pill .x:focus-visible{opacity:1;background:rgba(0,0,0,.22)}
.pill .x:focus-visible{outline-offset:0}

/* ---------- popovers ---------- */
.pop{position:absolute;z-index:50;background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r3);box-shadow:var(--shadow);padding:var(--s2);min-width:250px;max-width:min(440px,calc(100vw - 16px));transform-origin:top left;animation:pop var(--dur) var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.pop.ms{min-width:180px;width:max-content}
.pop .sel{display:flex;flex-wrap:wrap;gap:var(--s1);padding:var(--s1) var(--s1) var(--s2);border-bottom:1px solid var(--line);align-items:center;margin-bottom:var(--s1)}
.pop .sel input{background:none;border:0;outline:0;flex:1;min-width:90px;padding:4px 6px;height:26px}
.pop .opts{max-height:320px;overflow:auto;overscroll-behavior:contain;position:relative;margin-inline:calc(-1 * var(--s2))}
.pop .lbl{font-size:var(--t-label);font-weight:600;color:var(--fg3);padding:var(--s2) var(--s2) var(--s1);text-transform:uppercase;letter-spacing:.05em}
.opt{display:flex;align-items:center;gap:var(--s2);min-height:32px;padding:4px calc(var(--s2) * 2);cursor:pointer}
.opt.hl{background:var(--hover)}
@media (hover:hover){ .opt:hover{background:var(--hover)} }
/* the option's drag grip: same gesture, same hover-reveal as a row's, in its own reserved lane */
.opt .oh{width:16px;height:22px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:var(--fg3);opacity:0;cursor:grab;touch-action:none;border-radius:var(--r1);transition:opacity var(--dur) var(--ease),background var(--dur) var(--ease)}
.opt .oh svg.i{width:13px;height:13px}
@media (hover:hover){ .opt:hover .oh,.opt.hl .oh{opacity:1} .opt .oh:hover{background:var(--hover);color:var(--fg)} }
@media (hover:none){ .opt .oh{opacity:.6} }
.opt .oh:focus-visible{opacity:1}
.opt.lifted{opacity:.28}
body.dragging .opts .opt{transition:transform 140ms var(--ease)}
@media (prefers-reduced-motion:reduce){ body.dragging .opts .opt{transition:none} }
.ghost-opt{position:fixed;z-index:80;pointer-events:none;background:var(--bg3);border:1px solid var(--line2);border-radius:var(--r2);box-shadow:0 18px 48px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.35);animation:lift var(--dur) var(--ease)}
@media (prefers-reduced-motion: reduce){ .ghost-opt{animation:none} }
.opt .chk{width:16px;color:var(--accent);flex:none;display:inline-flex;justify-content:center}
.opt .chk svg.i{width:14px;height:14px;stroke-width:2.5}
.opt .more{margin-inline-start:auto;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;opacity:0;color:var(--fg3);flex:none}
.opt .more svg.i{width:14px;height:14px}
.opt:hover .more,.opt .more:focus-visible,.opt.hl .more{opacity:1}
.opt .more:hover{background:var(--line);color:var(--fg)}
.menu{min-width:190px}
.pop.help{min-width:380px}
.kbrow{display:grid;grid-template-columns:150px 1fr;gap:var(--s3);align-items:center;min-height:28px;padding:0 var(--s2);font-size:var(--t-ui)}
.kbrow kbd{font:var(--t-label) var(--font);color:var(--fg2);background:var(--bg3);border:1px solid var(--line2);border-radius:var(--r1);padding:2px 6px;white-space:nowrap;justify-self:start}
.mi{display:flex;align-items:center;gap:var(--s2);min-height:32px;padding:0 var(--s2);border-radius:var(--r2);cursor:pointer;white-space:nowrap;width:100%;text-align:start}
@media (hover:hover){ .mi:hover{background:var(--hover)} }
.mi.danger{color:var(--danger)}
.mi svg.i{width:15px;height:15px;opacity:.85}
.sep{height:1px;background:var(--line);margin:var(--s1) 0}
.hint{font-size:var(--t-label);color:var(--fg3);padding:0 var(--s2) var(--s1);line-height:1.4}
.swatches{display:grid;grid-template-columns:repeat(6,24px);gap:6px;padding:var(--s1) var(--s2) var(--s2)}
.sw{width:24px;height:24px;border-radius:5px;cursor:pointer;border:2px solid transparent}
.sw:hover,.sw:focus-visible{border-color:var(--fg)}
.sw.on{border-color:var(--fg);box-shadow:inset 0 0 0 2px var(--bg2)}
.rule select,.rule input{background:var(--bg3);border:1px solid var(--line2);border-radius:var(--r2);padding:0 var(--s2);height:30px;outline:0;font-size:var(--t-ui)}
.rule select:focus,.rule input:focus{border-color:var(--accent)}
.rule{display:flex;align-items:center;gap:6px;padding:3px 0}
.rule select{max-width:150px}
.rule input{flex:1;min-width:80px}
.rule .del{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg3);flex:none}
.rule .del svg.i{width:13px;height:13px}
.rule .del:hover{color:var(--danger);background:var(--hover)}
.addbtn{display:flex;align-items:center;gap:6px;min-height:32px;padding:0 var(--s2);color:var(--fg2);width:100%;text-align:start;font-size:var(--t-ui);margin-top:2px}
.addbtn svg.i{width:14px;height:14px}
@media (hover:hover){ .addbtn:hover{background:var(--hover);color:var(--fg)} }
.prow{display:flex;align-items:center;gap:var(--s2);min-height:32px;padding:0 var(--s2);border-radius:var(--r2)}
@media (hover:hover){ .prow:hover{background:var(--hover)} }
.prow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow svg.i{width:14px;height:14px;opacity:.75}
.prow .ib{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg3);flex:none}
.prow .ib:disabled{opacity:.3;cursor:default}
.prow .ib:not(:disabled):hover{color:var(--fg);background:var(--line)}
.prow .ib.on{color:var(--accent)}

/* ---------- side panel ---------- */
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(560px,100%);background:var(--bg2);border-inline-start:1px solid var(--line2);box-shadow:var(--shadow);z-index:40;transform:translateX(100%);visibility:hidden;transition:transform 180ms var(--ease),visibility 0s 180ms;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.drawer.on{transform:none;visibility:visible;transition:transform 180ms var(--ease)}
@media (prefers-reduced-motion: reduce){ .drawer,.drawer.on{transition:none} .pop,.toast{animation:none} }
.drawer .dh{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line)}
.drawer .dh .title{font-weight:700;font-size:16px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer .db{overflow:auto;padding:var(--s3) var(--s4) var(--s6);flex:1;overscroll-behavior:contain}
.field{display:grid;grid-template-columns:132px 1fr;gap:var(--s2);align-items:start;padding:6px 0;border-bottom:1px solid var(--line)}
.field .fl{color:var(--fg3);font-size:var(--t-ui);min-height:32px;display:flex;gap:6px;align-items:center}
.field .fl svg.i{width:13px;height:13px;opacity:.8}
.field .fv{min-height:32px;padding:6px var(--s2);border-radius:var(--r2);cursor:text;white-space:pre-wrap;overflow-wrap:anywhere;width:100%;text-align:start}
@media (hover:hover){ .field .fv:hover{background:var(--hover)} }
.field .fv.multi{display:flex;flex-wrap:wrap;gap:var(--s1);cursor:pointer;align-items:center}
.field .fv .none{color:var(--fg3)}

      const n = st.rows.reduce((a, r) => Math.max(a, +(String(r.id).match(/\d+/) || [0])[0]), 0) + 1;
      const r = { id: 's' + String(n).padStart(2, '0'), mtime: Date.now() / 1000,

    }

    }

  };

  addEventListener('DOMContentLoaded', () => {

<script>
(() => {
'use strict';
// ====================================================================== state
const PID = location.pathname.match(/\/p\/([a-z0-9-]+)/)[1];
const API = `/api/${PID}`;
const S = { schema: [], colors: { dark: {}, light: {} }, views: [], meta: {}, rows: [], vi: 0, q: '', editing: null, undo: [], redo: [], drawerId: null, i18n: {}, lang: 'en' };
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const svg = d => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const ICON = {
  x: svg('<path d="M18 6 6 18M6 6l12 12"/>'),
  check: svg('<path d="m5 12 5 5 9-11"/>'),
  more: svg('<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>'),
  grip: svg('<circle cx="9" cy="6" r="1.3"/><circle cx="15" cy="6" r="1.3"/><circle cx="9" cy="12" r="1.3"/><circle cx="15" cy="12" r="1.3"/><circle cx="9" cy="18" r="1.3"/><circle cx="15" cy="18" r="1.3"/>'),
  up: svg('<path d="m6 15 6-6 6 6"/>'), down: svg('<path d="m6 9 6 6 6-6"/>'),
  eye: svg('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>'),
  eyeOff: svg('<path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.3 4.2M6.6 6.6C3.7 8.6 2 12 2 12s3.5 7 10 7c1.6 0 3-.3 4.3-.9"/>'),
  table: svg('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/>'),
  plus: svg('<path d="M12 5v14M5 12h14"/>'),
  open: svg('<path d="M14 3h7v7M21 3l-9 9M19 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/>'),
  copy: svg('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'),
  trash: svg('<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>'),
  edit: svg('<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>'),
  filter: svg('<path d="M4 5h16l-6 8v5l-4 2v-7z"/>'),
};
const PALETTE = ['#772727','#b8860b','#294161','#599f7a','#6f5387','#0f7e80','#03591d','#ff9500','#ffea00','#61b70b','#2f434c','#404040','#696969','#8f8f8f','#bababa','#d65d0e','#cc241d','#458588','#b16286','#689d6a','#d79921','#fe8019','#83a598','#928374'];
const DEFW = { checkbox: 32, text: 160, multi: 130, longtext: 520 };

const view = () => S.views[S.vi];
// A view with `mirror` owns nothing but its own filters: order, hidden, widths,
// sort and compact all live on the view it names. Reading and writing layout
// through lay() is what makes the two physically incapable of drifting apart.
const lay = (v = view()) => (v && v.mirror ? (S.views.find(x => x.name === v.mirror) || S.views[0] || v) : v);
const col = k => S.schema.find(c => c.key === k);
const rowById = id => S.rows.find(r => r.id === id);
const clone = v => (v == null ? v : JSON.parse(JSON.stringify(v)));
const str = v => Array.isArray(v) ? v.join(', ') : v == null ? '' : String(v);
const strOf = (key, v) => Array.isArray(v) ? ordered(key, v).join(', ') : str(v);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const cellSel = (id, key) => `tr[data-id="${CSS.escape(id)}"] td[data-key="${CSS.escape(key)}"]`;
// ====================================================================== language
// Only the long descriptions are bilingual: the crew reads those, everything else
// (columns, tags, times) is already the same word in both languages or is data.
// Translations live in <Stem>.i18n.json, never in the notes, so Obsidian, the .base
// and every agent that reads a shot note keep seeing exactly one description.
// 'en' is HIS text, read straight from the notes and never written by the app in any
// other mode - so the raw master is one click away whatever the overlay holds.
// Every other entry is an overlay variant: a translation, or a tightened English.
const LANGS = [['en', 'EN', 'your original', 'en'], ['en2', 'EN✎', 'tightened English', 'en'], ['es', 'ES', 'Espanol', 'es']];
const LKEY = 'shotlist-lang-' + PID;
const translatable = c => c.type === 'longtext';
const trOf = (id, key, lang = S.lang) => (((S.i18n[lang] || {}).rows || {})[id] || {})[key];
// what a cell should SHOW: the translation when there is one, the English underneath when there is not
const disp = (r, c) => (S.lang !== 'en' && translatable(c) && trOf(r.id, c.key) != null) ? trOf(r.id, c.key) : str(r.props[c.key]);
const isUntranslated = (r, c) => S.lang !== 'en' && translatable(c) && !!str(r.props[c.key]) && trOf(r.id, c.key) == null;
// what an edit should WRITE: the note in English, the overlay in any other language
async function dispSet(r, c, text) {
  if (S.lang === 'en' || !translatable(c)) return save(r.id, c.key, text);
  return saveTr(r.id, c.key, text);
}
async function saveTr(id, key, text) {
  const lang = S.lang, prev = trOf(id, key, lang);
  ((S.i18n[lang] ||= {}).rows ||= {})[id] ||= {};
  if (text === '') delete S.i18n[lang].rows[id][key]; else S.i18n[lang].rows[id][key] = text;
  pushUndo({ type: 'tr', lang, id, key, prev, next: text === '' ? undefined : text });
  return flushTr(lang, { [id]: { [key]: text } }).catch(() => status('Translation save failed', true));
}
// throws on failure, so undo() can leave its entry on the stack; the ordinary edit path
// below catches instead, because a lost keystroke should not reject into the editor
async function flushTr(lang, rows) {
  status('Saving…');
  await api('PUT', '/i18n', { lang, patch: { rows } });
  status('Saved');
}
function setLangChrome(lang) {
  S.lang = lang; try { localStorage.setItem(LKEY, lang); } catch {}
  const b = $('#bLang'), i = LANGS.findIndex(x => x[0] === lang), l = LANGS[i < 0 ? 0 : i];
  b.querySelector('.t').textContent = l[1];
  b.classList.toggle('on', lang !== 'en');
  b.title = `Descriptions: ${l[2]} · click for ${LANGS[((i < 0 ? 0 : i) + 1) % LANGS.length][2]} (L)`;
  document.documentElement.lang = l[3];
}
function setLang(lang) { setLangChrome(lang); render(); if (S.drawerId) openDrawer(S.drawerId); }
const cycleLang = () => setLang(LANGS[(LANGS.findIndex(x => x[0] === S.lang) + 1) % LANGS.length][0]);

const btn = (cls, html, label, fn) => { const b = el('button', cls); b.type = 'button'; b.innerHTML = html; if (label) b.setAttribute('aria-label', label); if (fn) b.onclick = fn; return b; };
const menuItem = (pop, label, icon, fn, cls) => pop.append(btn('mi' + (cls ? ' ' + cls : ''), icon + `<span>${esc(label)}</span>`, null, fn));

// ====================================================================== api
async function api(method, path, body) {
  const r = await fetch(API + path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || (method + ' ' + path + ' ' + r.status));
  return r.json();
}
let statusT;
function status(t, err) { const s = $('#status'); s.textContent = t; s.classList.toggle('err', !!err); clearTimeout(statusT); if (!err && t) statusT = setTimeout(() => (s.textContent = ''), 1600); }

async function load() {
  const st = await api('GET', '/state');
  S.schema = st.schema; S.colors = st.colors; S.rows = st.rows;
  if (!S.views.length) S.views = st.views;
  S.meta = st.meta || {}; S.folderTitle = st.title; S.i18n = st.i18n || {}; i18nMt = st.i18nMtime || 0;
  $('#title').textContent = S.meta.title || st.title; $('#heading').textContent = S.meta.heading || '🎬 Shot list';
  document.title = (S.meta.title || st.title) + ' · Shot list';
  { let saved = null; try { saved = localStorage.getItem(LKEY); } catch {}
    setLangChrome(LANGS.some(x => x[0] === saved) ? saved : 'en'); }
  if (st.audio) { const a = $('#audio'); a.classList.remove('hidden'); a.querySelector('audio').src = `/p/${PID}/audio`; a.querySelector('.name').textContent = st.audioName; }
  render();
}

// ---- save (optimistic, undoable)
const pending = new Map();
async function save(id, key, value, { undoable = true } = {}) {
  const row = rowById(id); if (!row) return;
  if (Array.isArray(value)) value = ordered(key, value);   // the note ends up in the same order the screen shows
  const prev = clone(row.props[key]);
  row.props[key] = clone(value);
  if (undoable) pushUndo({ id, key, prev, next: clone(value) });
  status('Saving…');
  const put = () => api('PUT', `/rows/${encodeURIComponent(id)}`, { props: { [key]: value } });
  const p = put().catch(() => new Promise(r => setTimeout(r, 800)).then(put))
    .then(r => { row.mtime = r.mtime; row.props.updated = r.props.updated; status('Saved'); })
    .catch(e => { status('Save failed', true); toast('Save failed: ' + e.message); });
  pending.set(id, p); await p; pending.delete(id);
}
// Every action that changes the board pushes one of these, so nothing is one-way.
function pushUndo(entry) { S.undo.push(entry); if (S.undo.length > 100) S.undo.shift(); S.redo = []; }
// add and delete are each other's inverse, so both directions share these two
async function undoRecreateRow(e) { const nr = await api('POST', '/rows', { props: e.props }); S.rows.push(nr); e.id = nr.id; }
async function undoRemoveRow(e) { await api('DELETE', `/rows/${encodeURIComponent(e.id)}`); S.rows = S.rows.filter(x => x.id !== e.id); if (S.drawerId === e.id) closeDrawer(); }

async function undo(redo) {
  const stack = redo ? S.redo : S.undo; const u = stack.pop(); if (!u) return;
  const back = !redo;                                   // true = undoing, false = redoing
  const say = what => toast((redo ? 'Redid ' : 'Undid ') + what);
  const keep = () => (redo ? S.undo : S.redo).push(u);
  try {
    switch (u.type) {
      case 'colorder': {
        const v = S.views[u.vi]; if (!v) return toast('That view no longer exists');
        v.order = clone(back ? u.prev : u.next); persistViews(); render(); keep();   // stay on the tab you are on
        return say('the move of ' + u.name);
      }
      case 'roworder': {
        await commitOrder(back ? u.prev : u.next, { keepSort: true, silent: true }); keep();
        return say('the row move');
      }
      case 'rowadd': {                                   // undo a new row by removing it
        back ? await undoRemoveRow(u) : await undoRecreateRow(u); render(); keep();
        return say('the new row');
      }
      case 'rowdel': {                                   // undo a delete by writing the row back
        back ? await undoRecreateRow(u) : await undoRemoveRow(u); render(); keep();
        return say('the delete of ' + (str(u.props?.time) || 'that row'));
      }
      case 'optrename': {
        await renameOption(u.key, back ? u.to : u.from, back ? u.from : u.to, { undoable: false, quiet: true }); keep();
        return say(`the rename of "${back ? u.to : u.from}"`);
      }
      case 'optdel': {
        if (back) {
          for (const t of ['dark', 'light']) if (u.cols[t]) { (S.colors[t][u.key] ||= {})[u.opt] = u.cols[t]; persistColors(t); }
          for (const h of u.hits) if (rowById(h.id)) await save(h.id, u.key, clone(h.prev), { undoable: false });
        } else { await deleteOption(u.key, u.opt, { undoable: false }); }
        render(); keep(); return say(`the delete of "${u.opt}"`);
      }
      case 'tr': {                                       // a translated description
        const v = back ? u.prev : u.next;
        ((S.i18n[u.lang] ||= {}).rows ||= {})[u.id] ||= {};
        if (v == null) delete S.i18n[u.lang].rows[u.id][u.key]; else S.i18n[u.lang].rows[u.id][u.key] = v;
        await flushTr(u.lang, { [u.id]: { [u.key]: v == null ? '' : v } });
        render(); if (S.drawerId) openDrawer(S.drawerId); keep();
        return say(`the ${u.lang.toUpperCase()} ${col(u.key)?.name || u.key}`);
      }
      case 'optorder': {
        (S.meta.optionOrder ||= {})[u.key] = clone(back ? u.prev : u.next);
        await persistOptionOrder(); render(); keep();
        return say(`the order of ${col(u.key)?.name || u.key} tags`);
      }
      case 'color': {
        const hx = back ? u.prev : u.next;
        if (hx) (S.colors[u.theme][u.key] ||= {})[u.opt] = hx;
        else if (S.colors[u.theme][u.key]) delete S.colors[u.theme][u.key][u.opt];
        persistColors(u.theme); render(); keep();
        return say(`the colour of "${u.opt}"`);
      }
      default: {                                         // a cell edit
        if (!rowById(u.id)) return toast('That row no longer exists');
        await save(u.id, u.key, back ? u.prev : u.next, { undoable: false }); keep();
        render(); if (S.drawerId) openDrawer(S.drawerId);
        return say('change to ' + (col(u.key)?.name || u.key));
      }
    }
  } catch (err) { toast((redo ? 'Redo' : 'Undo') + ' failed: ' + err.message); }
}

  const drag = (elm, fn) => { elm.onpointerdown = e => { e.preventDefault(); hx.blur(); try { elm.setPointerCapture(e.pointerId); } catch (err) {} const mv = ev => { const b = elm.getBoundingClientRect(); fn(Math.max(0, Math.min(1, (ev.clientX - b.left) / b.width)), Math.max(0, Math.min(1, (ev.clientY - b.top) / b.height))); }; mv(e); elm.onpointermove = mv; elm.onpointerup = elm.onpointercancel = () => { elm.onpointermove = null; drawPresets(); }; }; };
  drag(sv, (x, y) => { sat = x; val = 1 - y; paint(); });
  drag(hue, x => { h = x * 359.99; paint(); });
  hx.oninput = () => { if (/^#[0-9a-f]{6}$/i.test(hx.value)) { hex = hx.value.toLowerCase(); [h, sat, val] = rgbToHsv(...hexToRgb(hex)); paint(true); } else hx.classList.toggle('bad', hx.value.length >= 7); };
  hx.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') finish(true); else if (e.key === 'Escape') finish(false); };
  eye.onclick = async () => { try { const r = await new EyeDropper().open(); hex = r.sRGBHex.toLowerCase(); [h, sat, val] = rgbToHsv(...hexToRgb(hex)); paint(true); drawPresets(); } catch (e) { /* cancelled */ } };
  const finish = commit => { if (done) return; done = true; ce.remove(); document.removeEventListener('mousedown', outside, true); document.removeEventListener('keydown', keys, true); if (commit) { remember(hex); onDone(hex); } else onDone(null); };
  const outside = e => { if (!ce.contains(e.target)) finish(true); };
  const keys = e => { if (e.key === 'Escape') { e.stopPropagation(); finish(false); } };
  cancel.onclick = () => finish(false); ok.onclick = () => finish(true);
  setTimeout(() => { document.addEventListener('mousedown', outside, true); document.addEventListener('keydown', keys, true); }, 0);
  // fixed to the viewport, under the anchor when it fits, above it otherwise, always clamped on screen; zoom-aware like the popovers
  const z = parseFloat(document.documentElement.style.zoom) || 1;
  const r = anchor?.isConnected ? anchor.getBoundingClientRect() : null;
  const placeEditor = () => {
    const b = ce.getBoundingClientRect(); const w = b.width || 264, hgt = b.height || 330;
    let x, y;
    if (r && (r.width || r.height)) { x = Math.min(r.left, innerWidth - w - 8); y = r.bottom + 6; if (y + hgt > innerHeight - 8) y = r.top - hgt - 6; }
    else { x = (innerWidth - w) / 2; y = (innerHeight - hgt) / 2; }
    x = Math.max(8, x); if (y < 8 || y + hgt > innerHeight - 8) y = Math.max(8, innerHeight - hgt - 8);
    ce.style.left = x / z + 'px'; ce.style.top = y / z + 'px';
  };
  placeEditor(); requestAnimationFrame(placeEditor);
  paint(true, true); drawPresets(); hx.focus({ preventScroll: true }); hx.select();
}

// ====================================================================== tag colours panel (dark and light sets, opens the colour editor)
let cTheme = 'dark';
const $$ = s => [...document.querySelectorAll(s)];
function openColors() { cTheme = theme(); const d = $('#cdrawer'); d.classList.add('on'); d.setAttribute('aria-hidden', 'false'); drawColors(); $('#cq').focus({ preventScroll: true }); }
function closeColors() { const d = $('#cdrawer'); d.classList.remove('on'); d.setAttribute('aria-hidden', 'true'); }
const cSaveT = {};
function setThemeColor(t, key, val, hex) {
  (S.colors[t][key] ||= {})[val] = hex;
  clearTimeout(cSaveT[t]); cSaveT[t] = setTimeout(() => persistColors(t), 300);
  if (t === theme()) render();
}
function clearThemeColor(t, key, val) { if (S.colors[t][key]) { delete S.colors[t][key][val]; if (!Object.keys(S.colors[t][key]).length) delete S.colors[t][key]; } persistColors(t); if (t === theme()) render(); drawColors(); }
function drawColors() {
  const list = $('#clist'); list.innerHTML = ''; const q = ($('#cq').value || '').trim().toLowerCase();
  $$('.segb').forEach(b => { b.classList.toggle('on', b.dataset.t === cTheme); b.setAttribute('aria-selected', b.dataset.t === cTheme); });
  const other = cTheme === 'dark' ? 'light' : 'dark'; let n = 0;
  $('#cCopy').querySelector('.t').textContent = `Copy ${other} colours into ${cTheme}`;
  S.schema.filter(c => c.type === 'multi').forEach(c => {
    const vals = optionsFor(c.key).filter(v => !q || v.toLowerCase().includes(q) || c.name.toLowerCase().includes(q));   // same order as the picker
    if (!vals.length) return;
    list.append(el('div', 'cgroup', c.name));
    vals.forEach(v => {
      n++; const own = (S.colors[cTheme][c.key] || {})[v]; const shown = own || (S.colors[other][c.key] || {})[v] || colorFor(c.key, v);
      const row = el('div', 'crow');
      const p = el('span', 'pill ro'); p.style.background = shown; p.style.color = fgFor(shown); p.classList.toggle('bright', isBright(shown)); p.append(el('span', 't', v)); const left = el('div'); left.append(p);
      if (!own) left.append(el('span', 'auto', (S.colors[other][c.key] || {})[v] ? `from ${other}` : 'auto'));
      const pick = btn('cpick', '', `${v}: open colour editor`); pick.style.background = shown;
      const hex = el('input', 'chex'); hex.value = shown; hex.setAttribute('aria-label', `${v} hex`); hex.spellcheck = false;
      const del = btn('cdel', ICON.x, `Remove ${v} colour in ${cTheme} mode`, () => clearThemeColor(cTheme, c.key, v)); del.disabled = !own; del.title = own ? 'Remove this colour (falls back to the other mode, then auto)' : 'No colour set in this mode';
      const apply = h => { if (!/^#[0-9a-f]{6}$/i.test(h)) { hex.classList.add('bad'); return; } hex.classList.remove('bad'); h = h.toLowerCase(); pick.style.background = h; hex.value = h; p.style.background = h; p.style.color = fgFor(h); p.classList.toggle('bright', isBright(h)); setThemeColor(cTheme, c.key, v, h); left.querySelector('.auto')?.remove(); del.disabled = false; };
      pick.onclick = () => { const was = own; openColorEditor(pick, shown, v, hx => { pick.style.background = hx; hex.value = hx; p.style.background = hx; p.style.color = fgFor(hx); p.classList.toggle('bright', isBright(hx)); setThemeColor(cTheme, c.key, v, hx); left.querySelector('.auto')?.remove(); del.disabled = false; }, hx => { if (hx === null) { if (was) setThemeColor(cTheme, c.key, v, was); else clearThemeColor(cTheme, c.key, v); drawColors(); } }); };
      hex.oninput = () => { if (/^#[0-9a-f]{6}$/i.test(hex.value)) apply(hex.value); else hex.classList.toggle('bad', hex.value.length >= 7); }; hex.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') { apply(hex.value); hex.blur(); } };
      const cpy = btn('cdel', ICON.copy, `Copy ${v} hex`, () => copyText(hex.value)); cpy.title = 'Copy hex';
      row.append(left, pick, hex, cpy, del); list.append(row);
    });
  });
  if (!n) list.append(el('div', 'empty', q ? `Nothing matches “${q}”` : 'No tag values yet'));
}
$('#bColors').onclick = () => $('#cdrawer').classList.contains('on') ? closeColors() : openColors();
$('#cclose').onclick = closeColors;
$('#cq').oninput = drawColors; $('#cq').onkeydown = e => { e.stopPropagation(); if (e.key === 'Escape') { if ($('#cq').value) { $('#cq').value = ''; drawColors(); } else closeColors(); } };
$$('.segb').forEach(b => b.onclick = () => { cTheme = b.dataset.t; drawColors(); });
$('#cCopy').onclick = () => { const other = cTheme === 'dark' ? 'light' : 'dark'; let n = 0; for (const k in S.colors[other]) for (const v in S.colors[other][k]) { if (!(S.colors[cTheme][k] || {})[v]) { (S.colors[cTheme][k] ||= {})[v] = S.colors[other][k][v]; n++; } } if (n) { persistColors(cTheme); if (cTheme === theme()) render(); } drawColors(); toast(n ? `Copied ${n} colour${n === 1 ? '' : 's'} from ${other}` : `Nothing new to copy from ${other}`); };

// ====================================================================== misc ui
function toast(msg) { $('.toast')?.remove(); const t = el('div', 'toast', msg); t.setAttribute('role', 'status'); document.body.append(t); setTimeout(() => t.remove(), 3500); }
function showSearch(on) { const s = $('#search'); s.classList.toggle('on', on); $('#bSearch').classList.toggle('on', on); if (on) $('#q').focus(); else { $('#q').value = ''; S.q = ''; render(); } }
$('#bSearch').onclick = () => showSearch(!$('#search').classList.contains('on'));
$('#qx').onclick = () => showSearch(false);
$('#q').oninput = () => { S.q = $('#q').value; render(); };
$('#q').onkeydown = e => { if (e.key === 'Escape') showSearch(false); };
$('#bSort').onclick = e => sortPop(e.currentTarget);
$('#bFilter').onclick = e => filterPop(e.currentTarget);
$('#bProps').onclick = e => propsPop(e.currentTarget);
$('#bNew').onclick = () => newRow();
// the two headings are editable in place: click, type, Enter or click away saves, Esc restores
[['#title', 'title', () => S.folderTitle], ['#heading', 'heading', () => '🎬 Shot list']].forEach(([sel, key, fallback]) => {
  const h = $(sel); try { h.contentEditable = 'plaintext-only'; } catch (e) { h.contentEditable = 'true'; } if (!h.isContentEditable) h.contentEditable = 'true'; h.spellcheck = false; h.setAttribute('role', 'textbox'); h.setAttribute('aria-label', key === 'title' ? 'Page title' : 'Section heading');
  let before = '';
  h.onfocus = () => { before = h.textContent; S.editing = { meta: key }; };
  h.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') { e.preventDefault(); h.blur(); } else if (e.key === 'Escape') { e.preventDefault(); h.textContent = before; h.blur(); } };
  h.onblur = () => {
    S.editing = null; const v = h.textContent.trim() || fallback(); h.textContent = v;
    if (v === before) return;
    S.meta[key] = v === fallback() ? '' : v; if (key === 'title') document.title = v + ' · Shot list';
    api('PUT', '/views', { meta: { [key]: S.meta[key] } }).then(() => status('Saved')).catch(() => status('Save failed', true));
  };
});
function toggleCompact() { const v = lay(); v.compact = !v.compact; persistViews(); render(); }
$('#bCompact').onclick = toggleCompact;
// ---- zoom: ⌘+ / ⌘− / ⌘0, persisted per browser
const ZSTEP = 0.05, ZMIN = 0.5, ZMAX = 1.6;
let zoom = 0.9; try { zoom = parseFloat(localStorage.getItem('shotlist-zoom')) || 0.9; } catch (e) {}
function setZoom(z) {
  zoom = Math.min(ZMAX, Math.max(ZMIN, Math.round(z * 100) / 100));
  document.documentElement.style.zoom = zoom; $('#zPct').textContent = Math.round(zoom * 100) + '%';
  try { localStorage.setItem('shotlist-zoom', zoom); } catch (e) {}
  closePop();
}
$('#zIn').onclick = () => setZoom(zoom + ZSTEP); $('#zOut').onclick = () => setZoom(zoom - ZSTEP); $('#zPct').onclick = () => setZoom(1);
document.addEventListener('keydown', e => {
  if (!(e.metaKey || e.ctrlKey) || e.altKey) return;
  if (e.key === '=' || e.key === '+') { e.preventDefault(); setZoom(zoom + ZSTEP); }
  else if (e.key === '-' || e.key === '_') { e.preventDefault(); setZoom(zoom - ZSTEP); }
  else if (e.key === '0') { e.preventDefault(); setZoom(1); }
}, true);
setZoom(zoom);
$('#bTheme').onclick = () => { const cur = theme() === 'light' ? 'dark' : 'light'; document.documentElement.dataset.theme = cur; try { localStorage.setItem('shotlist-theme', cur); } catch (e) {} render(); if (S.drawerId) openDrawer(S.drawerId); if ($('#cdrawer').classList.contains('on')) { cTheme = cur; drawColors(); } };
(() => { let t = null; try { t = localStorage.getItem('shotlist-theme'); } catch (e) {} if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; document.documentElement.dataset.theme = t; })();

(function boot(n) {
  load().catch(e => { status('Waiting for server…', true); if (n === 0) $('#wrap').innerHTML = `<div class="empty">Server not reachable yet, retrying… (${esc(e.message)})</div>`; setTimeout(() => boot(n + 1), 2000); });
})(0);
})();
</script>
