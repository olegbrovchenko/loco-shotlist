<!doctype html>
<html lang="en">
<head>

<style>
:root{
  --bg:#1d2021; --bg2:#282828; --bg3:#32302f; --line:#3c3836; --line2:#504945;
  --fg:#ffffff; --fg2:#c8c8c8; --fg3:#9a9a9a; --accent:#fe8019; --title:#fb4934;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r1:4px; --r2:6px; --r3:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 80px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

header{position:sticky;top:0;z-index:10;background:rgba(29,32,33,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left))}
.hrow{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:12px}
h1{font-size:17px;font-weight:800;color:var(--title);margin:0;letter-spacing:-.01em;line-height:1.2;flex:1;min-width:0}
h1 small{display:block;font-size:11px;font-weight:600;color:var(--fg3);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.lang{display:flex;gap:2px;background:var(--bg3);border:1px solid var(--line2);border-radius:var(--r2);padding:2px;flex:none}
.lang button{appearance:none;background:none;border:0;color:var(--fg3);font:700 12px/1 var(--font);letter-spacing:.05em;padding:7px 11px;border-radius:var(--r1);cursor:pointer;min-height:32px}
.lang button[aria-pressed="true"]{background:var(--accent);color:#1d2021}

.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--fg3);margin-bottom:18px}
.meta b{color:var(--fg2);font-weight:700}

.sec{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:16px 0 0;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sec:first-of-type{margin-top:0}
#cards .sec:first-of-type{margin-top:0}

#cards{display:grid;grid-template-columns:1fr;gap:10px;align-items:start}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r3);padding:14px}

/* the wide layout: the same table he works in, shown the moment there is room for it -
   a phone turned sideways is 812px and gets it, a phone held upright does not */
#table{display:none}
@media (min-width:700px){
  #cards{display:none}
  #table{display:block}
}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13.5px}
thead th{position:sticky;top:57px;z-index:5;background:var(--bg3);text-align:left;font-size:10.5px;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
tbody td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45}
tbody tr:hover td{background:var(--bg2)}
td.tcc{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;color:var(--fg)}
td.dc{color:var(--fg)}
td .pill{margin:0 3px 3px 0}
tr.secrow td{background:var(--bg);padding:16px 10px 6px;border-bottom:1px solid var(--line2);
  font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
tr.secrow:first-child td{padding-top:4px}
col.c-time{width:104px} col.c-set{width:13%} col.c-cast{width:13%}
col.c-lens{width:62px} col.c-frame{width:66px} col.c-t_of_s{width:76px} col.c-action{width:96px}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.tc{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;color:var(--fg);white-space:nowrap}
.id{font-size:11px;font-weight:700;color:var(--fg3);letter-spacing:.06em;margin-left:auto}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.pill{display:inline-block;padding:3px 9px;border-radius:var(--r2);font-size:12.5px;font-weight:600;color:#fff;line-height:1.35}
.pill.bright{text-shadow:0 1px 2px rgba(0,0,0,.45)}
.d{font-size:15px;line-height:1.55;color:var(--fg);margin:0;overflow-wrap:anywhere}
.spec{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
.spec .k{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--fg3);align-self:center;margin-right:1px}

footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--fg3);line-height:1.6}

@media (max-width:560px){
  .wrap{padding-top:14px}
  .hrow{gap:8px}
  h1{font-size:15px}
  .card{padding:12px;border-radius:var(--r2)}
  .d{font-size:15px}
  .tc{font-size:14px}
}
@media print{
  #cards{display:none}
  #table{display:block}
  thead th{position:static;background:none;color:#000;border-bottom:1px solid #000}
  tbody td{border-bottom:1px solid #ccc}
  tbody tr{break-inside:avoid;page-break-inside:avoid}
  tr.secrow td{background:none;color:#000}
  body{background:#fff;color:#000}
  header{position:static;background:none;border-bottom:1px solid #ccc}
  .lang{display:none}
  .card{border:1px solid #ccc;background:none;break-inside:avoid;page-break-inside:avoid}
  .sec{color:#000;border-bottom:1px solid #000}
  .d,.tc{color:#000}
  .pill{border:1px solid #999;color:#000!important;background:none!important;text-shadow:none}
}
@media (prefers-reduced-motion:no-preference){ .card{transition:border-color .15s ease} }
</style>
</head>

a cara de RVFV, escondiendo a YAPI detras, y en el retroceso lo descubre sentado a su lado."}},{"id":"s09","tc":"2:05 - 2:23","sec":"Estribillo","set":["Main Set Exterior"],"cast":["YAPI","Dancers"],"spec":[["lens","Lens",["20mm"]],["frame","Frame",["Wide"]],["t_of_s","T of S",["Steadi"]],["action","Action",["Perform."]]],"d":{"en2":"MAIN FULL SET, RVFV + YAPI finishing the song. Choreography by the dancers.","es":"SET PRINCIPAL COMPLETO, RVFV + YAPI rematando la cancion. Coreografia de los bailarines."}},{"id":"s10","tc":"2:23 - 2:42","sec":"Outro","set":["Main Set Exterior"],"cast":["Extras"],"spec":[["lens","Lens",["20mm"]],["frame","Frame",["Mid"]],["t_of_s","T of S",["Steadi"]],["action","Action",["Perform."]]],"d":{"en2":"B-roll recap.","es":"Repaso de b-roll."}},{"id":"s21","tc":"","sec":"B-roll, no timecode","set":["Pool"],"cast":["Extras"],"spec":[["lens","Lens",["16mm"]],["frame","Frame",["Mid"]],["t_of_s","T of S",["HandHeld"]],["action","Action",["B-Roll"]]],"d":{"en2":"B-rolls POOL - PEOPLE - GLASS BOX","es":"B-rolls PISCINA - GENTE - CAJA DE CRISTAL"}},{"id":"s22","tc":"","sec":"B-roll, no timecode","set":["Main Set Exterior"],"cast":["Extras"],"spec":[["lens","Lens",["58mm"]],["frame","Frame",["Mid"]],["t_of_s","T of S",["HandHeld"]],["action","Action",["B-Roll"]]],"d":{"en2":"B-rolls Beer Pong","es":"B-rolls Beer Pong"}}],"colors":{"set␟Terraza":"#518f13","cast␟Extras":"#772727","lens␟20mm":"#404040","frame␟Mid":"#404040","t_of_s␟HandHeld":"#772727","action␟B-Roll":"#0f7e80","set␟Main Set Inside":"#9d6102","cast␟RVFV":"#294161","cast␟Dancers":"#437a5d","lens␟58mm":"#404040","t_of_s␟Steadi":"#2f434c","action␟Perform.":"#03591d","set␟Main Set Exterior":"#bb4b08","frame␟Wide":"#404040","set␟❓❓❓❓":"#292929","lens␟37mm":"#404040","set␟Wooden wall":"#66472a","t_of_s␟Tripod":"#696969","set␟Garage":"#404040","cast␟YAPI":"#b8860b","set␟Green Wall":"#03591d","set␟Pool":"#1f3e6b","lens␟16mm":"#404040"},"langs":["en2","es"],"sets":["Garage","Green Wall","Main Se const LS = 'loco-shotlist-lang';
let lang = (() => { try { const v = localStorage.getItem(LS); return DATA.langs.includes(v) ? v : DATA.langs[0]; } catch (e) { return DATA.langs[0]; } })();
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function lum(hex){ const m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})/i.exec(hex); if(!m) return 0;
  const [r,g,b]=[1,2,3].map(i=>{const c=parseInt(m[i],16)/255; return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);});
  return 0.2126*r+0.7152*g+0.0722*b; }
const pill = (key, v) => { const bg = DATA.colors[key + '\u241f' + v] || '#504945';
  return `<span class="pill${lum(bg)>0.45?' bright':''}" style="background:${bg}">${esc(v)}</span>`; };
const text = r => r.d[lang] || r.d[DATA.langs[0]] || '';
function render(){
  // one loop feeds both layouts, so the table and the cards cannot drift apart
  let cards = '', rows = '', sec = null;
  const cols = DATA.rows[0] ? DATA.rows[0].spec.map(([k, name]) => [k, name]) : [];
  for (const r of DATA.rows){
    if (r.sec !== sec){
      sec = r.sec;
      if (sec){
        cards += `<h2 class="sec">${esc(sec)}</h2>`;
        rows += `<tr class="secrow"><td colspan="${cols.length + 4}">${esc(sec)}</td></tr>`;
      }
    }
    const spec = r.spec.filter(([, , v]) => v.length).map(([k, name, v]) =>
      `<span class="k">${esc(name)}</span>` + v.map(x => pill(k, x)).join('')).join('');

      <div class="top">${r.tc ? `<span class="tc">${esc(r.tc)}</span>` : ''}<span class="id">${esc(r.id.toUpperCase())}</span></div>

      <p class="d">${esc(text(r))}</p>
      ${spec ? `<div class="spec">${spec}</div>` : ''}
    </article>`;
    rows += `<tr>
      <td class="tcc">${esc(r.tc)}</td>
      <td>${r.set.map(v => pill('set', v)).join('')}</td>
      <td>${r.cast.map(v => pill('cast', v)).join('')}</td>
      ${r.spec.map(([k, , v]) => `<td>${v.map(x => pill(k, x)).join('')}</td>`).join('')}

}
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => {
  lang = b.dataset.l; try { localStorage.setItem(LS, lang); } catch (e) {}
  render();
});
render();
</script>
